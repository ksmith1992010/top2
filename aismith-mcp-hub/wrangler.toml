name = "aismith-mcp-hub"
main = "src/index.ts"
compatibility_date = "2025-11-01"
compatibility_flags = ["nodejs_compat"]

# Non-secret configuration (override per environment as needed).
# Secrets (MCP_BEARER_TOKEN, GITHUB_TOKEN) must be set via:
#   npx wrangler secret put MCP_BEARER_TOKEN
#   npx wrangler secret put GITHUB_TOKEN
# or locally in .dev.vars (see .dev.vars.example).
[vars]
GITHUB_OWNER = "ksmith1992010"
# Comma-separated repository names or owner/name pairs. Example:
# GITHUB_ALLOWED_REPOS = "my-app,ksmith1992010/other-repo"
GITHUB_ALLOWED_REPOS = ""
ENABLE_CREATE_GITHUB_ISSUE = "false"
MAX_FILE_SIZE_BYTES = "102400"
MAX_RESPONSE_SIZE_BYTES = "204800"
REQUEST_TIMEOUT_MS = "15000"
RATE_LIMIT_MAX_REQUESTS = "60"
RATE_LIMIT_WINDOW_MS = "60000"

[observability]
enabled = true
